<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0f"><title>Геля-Геля</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0d0d0f;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100svh}.wrap{width:min(720px,100%);margin:auto;padding:18px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between}.top h1{margin:0;font-size:24px}.chip{font-size:12px;color:#bbb;background:#242428;padding:6px 9px;border-radius:999px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;background:#19191c;border:1px solid #303036;border-radius:18px;padding:8px}button{border:0;border-radius:13px;padding:13px;font-size:15px;font-weight:800}.tabs button{background:#29292e;color:#fff}.tabs button.active,.primary{background:#ffd500;color:#111}.secondary{background:#2c2c31;color:#fff}.danger{background:#3a2325;color:#ffb8b8}.card{margin-top:16px;background:#19191c;border:1px solid #303036;border-radius:20px;padding:16px}.uploadGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick{display:block;text-align:center;border:1.5px dashed #4b4b53;border-radius:17px;padding:22px 10px}.pick input{display:none}.pick strong{display:block;font-size:17px}.pick span{display:block;color:#999;margin-top:6px;font-size:12px}label{display:block;font-size:12px;color:#aaa;margin:12px 0 6px}textarea,input,select{width:100%;background:#0f0f11;color:#fff;border:1px solid #3a3a42;border-radius:12px;padding:12px;font-size:15px}textarea{min-height:82px}.primary,.secondary,.danger{width:100%;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statusrow{display:flex;justify-content:space-between;gap:12px}.bar{height:11px;background:#303036;border-radius:999px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#ffd500;transition:width .2s}.muted{font-size:13px;color:#999;line-height:1.45}.log{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;color:#b9b9c1;margin-top:12px;background:#101012;border-radius:12px;padding:10px;min-height:88px;max-height:230px;overflow:auto}.hidden{display:none!important}.queueItem{margin-top:9px;background:#101012;border:1px solid #2d2d33;border-radius:13px;padding:11px}.queueCode{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.queueBtns{display:grid;grid-template-columns:1fr auto;gap:8px}.queueBtns button{margin-top:8px}.checkList{display:grid;gap:8px}.checkRow{display:flex;align-items:center;gap:9px;background:#101012;padding:9px;border-radius:11px}.checkRow input{width:auto}.checkRow label{margin:0;color:#ddd}.toggleRow{display:flex;align-items:center;gap:10px;margin-top:12px}.toggleRow input{width:auto}@media(max-width:540px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><h1>Геля-Геля</h1><span class="chip">v5 SAFE</span></div>
<div class="tabs"><button id="tabRun" class="active">Запуск</button><button id="tabSettings">Налаштування</button></div>
<section id="runPane"><div class="card"><div class="uploadGrid">
<label class="pick"><input id="cameraInput" type="file" accept="image/*" capture="environment"><strong>📷 Сфоткати</strong><span>відкрити камеру</span></label>
<label class="pick"><input id="galleryInput" type="file" accept="image/*" multiple><strong>🖼️ Галерея</strong><span>можна кілька чеків</span></label>
</div><label>Або встав QR-посилання</label><textarea id="surveyUrl"></textarea><button id="startBtn" class="primary">Запустити це посилання</button></div>
<div id="queueCard" class="card hidden"><strong>Чеки в пам'яті</strong><span id="queueCount"></span><div id="queueList"></div><button id="clearQueueBtn" class="danger">Очистити список</button></div>
<div class="card"><div class="statusrow"><strong id="status">Готово</strong><span id="percent">0%</span></div><div class="bar"><div id="barFill" style="width:0"></div></div><div id="detail" class="muted">Фото тепер розпізнається на сервері, а не десятками проходів на телефоні.</div><div id="log" class="log">Очікую…</div><button id="stopBtn" class="secondary hidden">Зупинити</button></div></section>
<section id="settingsPane" class="hidden"><div class="card"><div class="grid"><div><label>Загальна оцінка</label><select id="satisfaction"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div><label>Замовлення</label><select id="orderCorrect"><option value="true">Все правильно</option><option value="false">Було неправильно</option></select></div></div>
<label>«Чим найбільше задоволені»</label><select id="reasonMode"><option value="fixed">Один фіксований варіант</option><option value="random">Випадково серед вибраних</option></select><div id="fixedReasonWrap"><select id="mainReason"><option>Швидкість обслуговування</option><option>Привітність персоналу</option><option>Якість їжі та/або напоїв</option><option>Чистота</option><option>Інше (будь ласка, уточніть)</option></select></div><div id="randomReasonsWrap" class="hidden checkList"><div class="checkRow"><input id="rrSpeed" type="checkbox" value="Швидкість обслуговування"><label for="rrSpeed">Швидкість обслуговування</label></div><div class="checkRow"><input id="rrFriendly" type="checkbox" value="Привітність персоналу"><label for="rrFriendly">Привітність персоналу</label></div><div class="checkRow"><input id="rrFood" type="checkbox" value="Якість їжі та/або напоїв"><label for="rrFood">Якість їжі та/або напоїв</label></div><div class="checkRow"><input id="rrClean" type="checkbox" value="Чистота"><label for="rrClean">Чистота</label></div></div>
<div class="grid"><div><label>Ціна / якість</label><select id="valueForMoney"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div><label>Повернуся</label><select id="revisit"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div></div>
<div class="toggleRow"><input id="randomPhraseEnabled" type="checkbox"><span>Випадкова фраза відгуку</span></div><div id="phrasePoolWrap" class="hidden"><label>Фрази, по одній у рядок</label><textarea id="feedbackPhrases"></textarea></div><div id="fixedCommentWrap"><label>Фіксований коментар</label><input id="visitComment"></div><label>Працівник / фінальний коментар</label><input id="employeeComment"><button id="saveBtn" class="primary">Зберегти налаштування</button></div></section>
<canvas id="convertCanvas" class="hidden"></canvas></div>
<script>
const $=id=>document.getElementById(id),KEY="gelya-preset-v5",QUEUE_KEY="gelya-queue-v5";
const DEF={satisfaction:5,orderCorrect:true,reasonMode:"fixed",mainReason:"Швидкість обслуговування",randomReasons:["Швидкість обслуговування","Привітність персоналу"],valueForMoney:5,revisit:5,randomPhraseEnabled:false,feedbackPhrases:["Все сподобалось","Швидко і смачно","Гарне обслуговування"],visitComment:"",employeeComment:""};
let currentJob=null,pollTimer=null,currentQueueUrl=null;
function setTab(run){$("runPane").classList.toggle("hidden",!run);$("settingsPane").classList.toggle("hidden",run);$("tabRun").classList.toggle("active",run);$("tabSettings").classList.toggle("active",!run)}$("tabRun").onclick=()=>setTab(true);$("tabSettings").onclick=()=>setTab(false);
function validUrl(raw){try{const u=new URL(raw);return u.protocol==="https:"&&u.hostname==="feedback.mcdonalds.com"&&u.pathname.startsWith("/jfe/form/SV_")}catch{return false}}
function getPreset(){try{return {...DEF,...(JSON.parse(localStorage.getItem(KEY))||{})}}catch{return {...DEF}}}function getQueue(){try{const q=JSON.parse(localStorage.getItem(QUEUE_KEY));return Array.isArray(q)?q.filter(validUrl):[]}catch{return []}}function setQueue(q){localStorage.setItem(QUEUE_KEY,JSON.stringify([...new Set(q)]));renderQueue()}function codeLabel(url){try{return new URL(url).searchParams.get("surv_cd")||"QR"}catch{return"QR"}}
function renderQueue(){const q=getQueue();$("queueCard").classList.toggle("hidden",!q.length);$("queueCount").textContent=" · "+q.length+" шт.";$("queueList").innerHTML="";q.forEach(url=>{const d=document.createElement("div");d.className="queueItem";d.innerHTML=`<div class="queueCode">${codeLabel(url)}</div><div class="queueBtns"><button class="primary useBtn">Використати</button><button class="danger removeBtn">✕</button></div>`;d.querySelector(".useBtn").onclick=()=>{currentQueueUrl=url;$("surveyUrl").value=url;startSurvey(url)};d.querySelector(".removeBtn").onclick=()=>setQueue(getQueue().filter(x=>x!==url));$("queueList").appendChild(d)})}$("clearQueueBtn").onclick=()=>setQueue([]);
function loadPreset(){const p=getPreset();for(const id of ["satisfaction","mainReason","valueForMoney","revisit","visitComment","employeeComment"])$(id).value=p[id]??"";$("orderCorrect").value=String(p.orderCorrect);$("reasonMode").value=p.reasonMode;$("randomPhraseEnabled").checked=!!p.randomPhraseEnabled;$("feedbackPhrases").value=(p.feedbackPhrases||[]).join("\n");const rs=new Set(p.randomReasons||[]);[["rrSpeed","Швидкість обслуговування"],["rrFriendly","Привітність персоналу"],["rrFood","Якість їжі та/або напоїв"],["rrClean","Чистота"]].forEach(([id,v])=>$(id).checked=rs.has(v));toggleSettings()}function toggleSettings(){const r=$("reasonMode").value==="random";$("fixedReasonWrap").classList.toggle("hidden",r);$("randomReasonsWrap").classList.toggle("hidden",!r);const rp=$("randomPhraseEnabled").checked;$("phrasePoolWrap").classList.toggle("hidden",!rp);$("fixedCommentWrap").classList.toggle("hidden",rp)}$("reasonMode").onchange=toggleSettings;$("randomPhraseEnabled").onchange=toggleSettings;
$("saveBtn").onclick=()=>{const randomReasons=["rrSpeed","rrFriendly","rrFood","rrClean"].filter(id=>$(id).checked).map(id=>$(id).value);const p={satisfaction:+$("satisfaction").value,orderCorrect:$("orderCorrect").value==="true",reasonMode:$("reasonMode").value,mainReason:$("mainReason").value,randomReasons,valueForMoney:+$("valueForMoney").value,revisit:+$("revisit").value,randomPhraseEnabled:$("randomPhraseEnabled").checked,feedbackPhrases:$("feedbackPhrases").value.split(/\n+/).map(s=>s.trim()).filter(Boolean),visitComment:$("visitComment").value.trim(),employeeComment:$("employeeComment").value.trim()};if(p.reasonMode==="random"&&!p.randomReasons.length)return alert("Вибери хоча б один варіант");localStorage.setItem(KEY,JSON.stringify(p));$("saveBtn").textContent="Збережено ✓";setTimeout(()=>$("saveBtn").textContent="Зберегти налаштування",800)};
function randomItem(a){return a[Math.floor(Math.random()*a.length)]}function presetForRun(){const p=getPreset(),o={...p};if(p.reasonMode==="random"&&p.randomReasons?.length)o.mainReason=randomItem(p.randomReasons);if(p.randomPhraseEnabled&&p.feedbackPhrases?.length)o.visitComment=randomItem(p.feedbackPhrases);return o}
function render(j){const p=Math.max(0,Math.min(100,Number(j?.progress||0)));$("status").textContent=j?.status||"Готово";$("percent").textContent=p+"%";$("barFill").style.width=p+"%";$("detail").textContent=j?.detail||"";$("log").textContent=j?.log?.length?j.log.join("\n"):"Очікую…";$("stopBtn").classList.toggle("hidden",j?.state!=="running")}
async function poll(){if(!currentJob)return;try{const r=await fetch("/api/jobs/"+currentJob,{cache:"no-store"});const j=await r.json();render(j);if(j.state!=="running"){clearInterval(pollTimer);pollTimer=null;currentJob=null;if(j.state==="done"&&currentQueueUrl){setQueue(getQueue().filter(x=>x!==currentQueueUrl));$("surveyUrl").value=""}currentQueueUrl=null}}catch(e){render({progress:100,status:"Помилка зв'язку",detail:e.message,log:[e.message]})}}
async function startSurvey(url){if(!validUrl(url))return render({progress:100,status:"Помилка",detail:"Невірне QR-посилання",log:[]});const preset=presetForRun();render({progress:3,status:"Старт…",detail:"Запускаю безпечний state-machine",log:["QR OK"]});const r=await fetch("/api/jobs",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({surveyUrl:url,preset})});const d=await r.json();if(!r.ok)return render({progress:100,status:"Помилка",detail:d.error||("HTTP "+r.status),log:[]});currentJob=d.id;render(d);clearInterval(pollTimer);pollTimer=setInterval(poll,700);poll()}$("startBtn").onclick=()=>{currentQueueUrl=null;startSurvey($("surveyUrl").value.trim())};$("stopBtn").onclick=()=>currentJob&&fetch("/api/jobs/"+currentJob,{method:"DELETE"}).catch(()=>{});
async function normalizePhoto(file){const img=await createImageBitmap(file),c=$("convertCanvas"),ctx=c.getContext("2d");const max=1800,s=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);ctx.drawImage(img,0,0,c.width,c.height);return await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error("Не вдалося підготувати фото")),"image/jpeg",.9))}
async function decodeQR(file){const blob=await normalizePhoto(file);const r=await fetch("/api/decode-qr",{method:"POST",headers:{"content-type":"image/jpeg"},body:blob});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"QR не знайдено");return d.value}
async function addFiles(files,autoStartSingle=false){const arr=[...files];if(!arr.length)return;const found=[],errors=[];for(let i=0;i<arr.length;i++){render({progress:Math.round(i/arr.length*20),status:"Читаю QR…",detail:`${i+1}/${arr.length}`,log:["Фото обробляється на сервері"]});try{const u=await decodeQR(arr[i]);if(validUrl(u))found.push(u);else errors.push(arr[i].name+": QR не анкети")}catch(e){errors.push(arr[i].name+": "+e.message)}}if(found.length){setQueue([...getQueue(),...found]);render({progress:0,status:"Готово",detail:`Додано: ${new Set(found).size}`,log:errors.length?errors:["QR знайдено"]});if(autoStartSingle&&found.length===1){currentQueueUrl=found[0];$("surveyUrl").value=found[0];startSurvey(found[0])}}else render({progress:100,status:"QR не знайдено",detail:"Не вдалося прочитати фото",log:errors})}
$("cameraInput").onchange=async e=>{await addFiles(e.target.files,true);e.target.value=""};$("galleryInput").onchange=async e=>{await addFiles(e.target.files,false);e.target.value=""};loadPreset();renderQueue();
if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
</script></body></html>
